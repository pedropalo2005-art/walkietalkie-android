name: Compilar Walkie Talkie APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew || true

      - name: Generar Gradle Wrapper si falta
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.6
            chmod +x gradlew
          fi

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: WalkieTalkie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar Release con APK Directo
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Walkie Talkie Android APK v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
